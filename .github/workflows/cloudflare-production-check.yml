name: Mindstack - verificar publicacion Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar version publica y API sin enviar datos
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const suffix='grupomindstack.workers.dev';
          const base='https://mindstack-web.'+suffix;
          const newBase=base;
          const expected=[['/','data-revision="home-09"'],['/preguntas-frecuentes/','data-revision="faq-07"'],['/evaluacion/','data-subdomain-migration="ready"'],['/aviso-de-privacidad/','2026-11-23-v2']];
          let ok=false;
          for(let attempt=1;attempt<=12;attempt++){
            const results=await Promise.all(expected.map(async ([path,marker])=>{
              try {
                const r=await fetch(base+path+'?release='+process.env.GITHUB_SHA+'&attempt='+attempt,{cache:'no-store',signal:AbortSignal.timeout(15000)});
                const html=await r.text();
                return {path,http:r.status,approved:r.ok&&html.includes(marker)&&r.headers.get('x-content-type-options')==='nosniff'&&r.headers.get('x-frame-options')==='DENY'&&Boolean(r.headers.get('content-security-policy')),revision:html.match(/data-revision="[^"]+"/)?.[0]||null};
              }catch(e){return {path,approved:false,error:String(e)}}
            }));
            console.log('PRODUCTION '+JSON.stringify({attempt,results}));
            if(results.every(r=>r.approved)){ok=true;break}
            if(attempt<12) await new Promise(r=>setTimeout(r,15000));
          }
          assert.ok(ok,'Cloudflare no sirve todas las revisiones aprobadas');
          const api='https://mindstack-evaluacion-api.'+suffix+'/api/estado';
          const origins=[base,newBase,'https://feature-evaluacion-empresarial-mvp-20261123-mindstack-web.'+newSuffix];
          let apiReady=false;
          for(let attempt=1;attempt<=8;attempt++){
            const results=await Promise.all([...new Set(origins)].map(async origin=>{
              try {
                const r=await fetch(api,{headers:{Origin:origin},signal:AbortSignal.timeout(10000)});
                const body=await r.json();
                return {origin,http:r.status,cors:r.headers.get('access-control-allow-origin'),status:body.status,privacyVersion:body.privacyVersion,ready:r.status===200&&r.headers.get('access-control-allow-origin')===origin&&body.status==='ready'&&body.privacyVersion==='2026-11-23-v2'};
              } catch(e){return {origin,ready:false,error:String(e)}}
            }));
            console.log('MIGRATION_API '+JSON.stringify({attempt,results}));
            if(results.every(r=>r.ready)){apiReady=true;break}
            if(attempt<8) await new Promise(r=>setTimeout(r,15000));
          }
          assert.ok(apiReady,'API no acepta todos los origenes de migracion');
          JS
