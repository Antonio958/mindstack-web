name: Mindstack - resolver dependencias
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    if: github.head_ref == 'feature/ciberseguridad'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolver versiones corregidas sin scripts ni actualizaciones forzadas
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --save-exact next@16.4.6
          npm install --package-lock-only --ignore-scripts --no-audit --save-dev --save-exact eslint-config-next@16.4.6
          npm audit fix --package-lock-only --ignore-scripts || true
          npm audit --omit=dev --audit-level=low --json > /tmp/audit-production.json || true
          npm audit --audit-level=low --json > /tmp/audit-all.json || true
          node -e "for(const f of ['/tmp/audit-production.json','/tmp/audit-all.json']){const a=require(f);console.log('AUDIT_SUMMARY '+JSON.stringify({file:f,metadata:a.metadata?.vulnerabilities,packages:Object.keys(a.vulnerabilities||{}),error:a.error}));}"
      - name: Exportar manifests reproducibles para revisión
        run: |
          node -e "const fs=require('fs');for(const f of ['package.json','package-lock.json']){const s=fs.readFileSync(f).toString('base64');for(let i=0;i<s.length;i+=5000) console.log('MANIFEST_CHUNK '+f+' '+i+' '+s.slice(i,i+5000));}"
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation
          path: |
            package.json
            package-lock.json
            /tmp/audit-production.json
            /tmp/audit-all.json
      - name: Confirmar que no quedan vulnerabilidades reportadas
        run: |
          npm audit --omit=dev --audit-level=low
          npm audit --audit-level=low
