name: Evaluacion empresarial - validacion

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sitio-estatico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias reproducibles
        run: npm ci
      - name: Comprobar reglas de interpretación
        run: node --experimental-strip-types --test tests/evaluacion.test.mjs
      - name: Verificar compilacion y exportacion estatica
        run: npm run build
      - name: Verificar contenido exportado
        run: |
          test -f out/index.html
          test -f out/404.html
          test -f out/evaluacion.html || test -f out/evaluacion/index.html
      - name: Verificar configuracion Worker web para Cloudflare
        run: |
          node -e "const fs=require('fs');const cfg=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));if(cfg.name!=='mindstack-web'||cfg.assets?.directory!=='./out'||cfg.preview_urls!==true||typeof cfg.previews!=='object')process.exit(1);"
      - name: Validar empaquetado Wrangler sin publicar
        run: npx --yes wrangler@4.164.0 deploy --dry-run --outdir .wrangler-build-check


  api-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias del worker
        run: npm install --prefix worker --no-audit --no-fund
      - name: Validar TypeScript del worker
        run: npm run check --prefix worker
      - name: Reproducir comando de build de Cloudflare API
        run: npm run build --prefix worker
      - name: Empaquetar Worker API con Wrangler sin desplegar
        run: cd worker && npx wrangler deploy --dry-run --outdir ../.wrangler-api-check
