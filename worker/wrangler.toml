name = "mindstack-evaluacion-api"
main = "src/index.ts"
compatibility_date = "2026-11-19"
workers_dev = true

# Worker API separado del Worker web.
# En el dashboard registrar DATABASE_URL, TURNSTILE_SECRET y PRIVACY_VERSION
# como secretos de runtime. No usar variables publicas ni subir credenciales a GitHub.
# La ruta /health responde 503 hasta que todos los secretos esten configurados.
# Para el lanzamiento final ALLOWED_ORIGIN debe ser el origen exacto del frontend.
# Los despliegues de pruebas publicas no deben captar datos sin aviso de privacidad.
[vars]
ALLOWED_ORIGIN = "https://mindstack-web.luispalmhdz06.workers.dev"
ALLOWED_PREVIEW_ORIGIN = "https://feature-evaluacion-empresarial-mvp-20261123-mindstack-web.luispalmhdz06.workers.dev"
